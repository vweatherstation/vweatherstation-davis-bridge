name: Build Davis Bridge EXE
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller
      - run: pyinstaller --onefile davis_bridge.py
      - uses: actions/upload-artifact@v4
        with:
          name: davis_bridge_exe
          path: dist/davis_bridge.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/davis_bridge.exe
